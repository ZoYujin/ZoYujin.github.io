intro:
  - >
    I am a Ph.D. candidate in Data Science at Seoul National University, advised by
    [Prof. Taesup Kim](https://snu-laal.com/) in the Learning and Adaptation Algorithms Lab.
  - >
    I study post-training of multimodal foundation models: how they acquire new capabilities
    without losing existing ones, and whether their reasoning stays grounded in visual evidence.
    Most recently, I completed a five-month research internship at LG AI Research's EXAONE Lab,
    where I studied reinforcement-learning post-training for general-purpose vision-language models.
  - >
    Before entering research, I worked as a journalist at The Chosun Ilbo. In both journalism and
    research, I have been happiest in conversations that help us understand one another and explore
    the world and intelligence, whether human or artificial.

availability: I am looking for research internships for Summer 2027.

research_intro: >
  My work studies tensions in foundation-model training: preserving old knowledge while acquiring
  new capabilities, following language priors while remaining grounded in visual evidence, and
  allocating learning signal across competing capabilities.

research_themes:
  - left: Prior knowledge
    right: New knowledge
    detail: Continual learning without replay or parameter growth (ICLR 2026)
  - left: Language priors
    right: Visual evidence
    detail: Training-free attention steering against hallucination (CVPR 2026 Findings)
  - left: Reasoning-heavy tasks
    right: Perception-heavy tasks
    detail: Allocating learning signal across competing capabilities in multi-task RL (NeurIPS 2026 Workshops)

