publications:
  - venue: NeurIPS 2026 Workshops
    title: "When Learning Signals Persist: Hidden Curricula in Vision-Language Reinforcement Learning"
    authors: Yujin Jo, Hyunjik Jo, Yireun Kim, Jinsik Lee, Taesup Kim
    summary: >
      Online filtering in group-relative RL turns a fixed data mixture into a hidden curriculum;
      the queries that remain gradient-eligible longest are not necessarily the most useful to train on.
    links:
      - label: VLM4RWD
        url: https://openreview.net/forum?id=GMleXoEnlb
      - label: Pre-to-Post
        url: https://openreview.net/forum?id=54IGilEzEN
  - venue: ICLR 2026
    title: Memory-Free Continual Learning with Null Space Adaptation for Zero-Shot Vision-Language Models
    authors: Yujin Jo, Taesup Kim
    summary: >
      Treats low-energy spectral directions as writable capacity, enabling continual adaptation
      without replay, a teacher model, task-specific modules, or parameter growth.
    links:
      - label: Paper
        url: https://arxiv.org/abs/2510.21175
      - label: Code
        url: https://github.com/ZoYujin/NuSA-CL
  - venue: CVPR 2026 Findings
    title: Attention-space Contrastive Guidance for Efficient Hallucination Mitigation in LVLMs
    authors: Yujin Jo, Sangyoon Bae, Taesup Kim
    summary: >
      A single-pass, training-free method that contrasts vision-conditioned and text-only
      attention paths to keep answers grounded in visual evidence.
    links:
      - label: Paper
        url: https://arxiv.org/abs/2601.13707
  - venue: WACV 2025
    title: Retaining and Enhancing Pre-trained Knowledge in Vision-Language Models with Prompt Ensembling
    authors: Donggeun Kim*, Yujin Jo*, Myungjoo Lee*, Taesup Kim (* equal contribution)
    summary: >
      Learns diverse prompt groups with attention isolation, then ensembles them to retain and
      improve pre-trained vision-language knowledge.
    links:
      - label: Paper
        url: https://arxiv.org/abs/2412.07077

